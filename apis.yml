name: Aspect Health
description: >-
  Aspect Health is a digital health company offering a science-backed program
  for women managing PCOS (Polycystic Ovary Syndrome). Its PCOS program combines
  continuous glucose monitoring (CGM), personalized coaching from board-certified
  health coaches, at-home lab testing for inflammation, hormonal, cardiovascular,
  and metabolic markers, and the Aida AI dietitian, all delivered through a mobile
  app. Additional programs cover weight loss, general women's health, and a 21-day
  check up, with HSA/FSA-eligible plans. Aspect Health is a Techstars-backed
  company and operates as a consumer (B2C) health platform; it does not currently
  publish a public developer API, SDK, or MCP server.
